<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light;
      --bg: #fdf7f9;
      --ink: #2a1720;
      --muted: #7a5e6a;
      --line: #ead9e0;
      --accent: #c13584;
      --track: #d9c6ce;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #1d1418;
        --ink: #f5e9ee;
        --muted: #b89aa7;
        --line: #3a2a31;
        --accent: #f06aa8;
        --track: #4a3840;
      }
    }
    body {
      margin: 0;
      width: 280px;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { padding: 16px 16px 10px; }
    h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 16px;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }
    label small { display: block; color: var(--muted); font-size: 12px; }
    input {
      appearance: none;
      flex: none;
      width: 34px;
      height: 20px;
      border-radius: 10px;
      background: var(--track);
      position: relative;
      cursor: pointer;
      transition: background .15s;
    }
    input::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s;
    }
    input:checked { background: var(--accent); }
    input:checked::after { transform: translateX(14px); }
    input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { input, input::after { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>IG Seen Blocker</h1>
    <p>Áp dụng ngay, không cần tải lại trang.</p>
  </header>
  <label>
    <span>Ẩn đã xem tin nhắn<small>Người gửi không thấy “Đã xem”</small></span>
    <input type="checkbox" id="blockDmSeen">
  </label>
  <label>
    <span>Ẩn đã xem story<small>Không hiện trong danh sách người xem</small></span>
    <input type="checkbox" id="blockStorySeen">
  </label>
  <label>
    <span>Ẩn đang nhập<small>Không hiện dấu “…” khi bạn gõ</small></span>
    <input type="checkbox" id="blockTyping">
  </label>
  <label>
    <span>Ghi log ra console<small>Dùng khi cần dò request mới</small></span>
    <input type="checkbox" id="debug">
  </label>
  <script src="popup.js"></script>
</body>
</html>
